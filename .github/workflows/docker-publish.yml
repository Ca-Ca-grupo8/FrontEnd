# Builda a imagem do frontend e publica no Docker Hub.
# - Pull request para a main: builda e publica com a tag pr-<número>.
# - Push na main: builda e publica com as tags latest e sha-<commit>.
# PRs vindos de fork não recebem os secrets, então só fazem o build (sem push).

name: Docker publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: eduardonl/caeca-frontend
      # Só publica se o evento não for de PR de fork (fork não tem acesso aos secrets)
      SHOULD_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Gerar tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          # O app fica na subpasta caeca/ do repositório
          context: ./caeca
          file: ./caeca/Dockerfile
          push: ${{ env.SHOULD_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
